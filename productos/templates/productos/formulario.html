<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de productos</title>
    <style>
        * { box-sizing: border-box; }
        body { max-width: 680px; margin: 40px auto; padding: 0 20px; font-family: Arial, sans-serif; color: #24323d; background: #f3f6f5; }
        h1 { color: #176b58; }
        form { padding: 24px; background: #fff; border: 1px solid #dce5e1; border-radius: 8px; }
        label { display: inline-block; margin-bottom: 7px; font-weight: 600; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid #bdcbc5; border-radius: 5px; font: inherit; }
        input:focus, select:focus { outline: 2px solid #80c4ad; border-color: #176b58; }
        button, a { transition: background-color .18s ease, color .18s ease, transform .18s ease; }
        button { padding: 10px 16px; border: 0; border-radius: 5px; color: #fff; background: #176b58; font: inherit; font-weight: 600; cursor: pointer; }
        button:hover { background: #105341; transform: translateY(-1px); }
        button:active { transform: translateY(1px); }
        a { color: #176b58; }
        a:hover { color: #0e4939; }
        a:focus-visible, button:focus-visible { outline: 3px solid #80c4ad; outline-offset: 3px; }
        @media (max-width: 480px) { body { margin-top: 24px; } form { padding: 18px; } }
    </style>
</head>
<body>

    <h1>
        {% if producto %}
            Editar producto
        {% else %}
            Registrar producto
        {% endif %}
    </h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <p>
            <label for="nombre">Nombre del producto:</label><br>
            <input
                id="nombre"
                type="text"
                name="nombre"
                maxlength="100"
                value="{{ producto.nombre|default:'' }}"
                required
            >
        </p>

        <p>
            <label for="precio">Precio:</label><br>
            <input
                id="precio"
                type="number"
                name="precio"
                min="0"
                step="0.01"
                value="{{ producto.precio|default:'' }}"
                required
            >
        </p>

        <p>
            <label for="cantidad">Cantidad disponible:</label><br>
            <input
                id="cantidad"
                type="number"
                name="cantidad"
                min="0"
                step="1"
                value="{{ producto.cantidad|default:'' }}"
                required
            >
        </p>


                <p>
            <label for="categoria_id">Categoría:</label><br>
            <select id="categoria_id" name="categoria_id" required>
                <option value="">-- Selecciona una categoría --</option>
                {% for categoria in categorias %}
                    <option
                        value="{{ categoria.id }}"
                        {% if producto.categoria_id|stringformat:"s" == categoria.id %}selected{% endif %}
                    >
                        {{ categoria.nombre }}
                    </option>
                {% endfor %}
            </select>
        </p>

        {% if not categorias %}
            <p>
                Primero debes crear una categoría.
                <a href="{% url 'categorias:crear' %}">Crear categoría</a>
            </p>
        {% endif %}

        <button type="submit">Guardar producto</button>
    </form>

    <p>
        <a href="{% url 'productos:listar' %}">
            Volver al inventario
        </a>
    </p>

</body>
</html>
