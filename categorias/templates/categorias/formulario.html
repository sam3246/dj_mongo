<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de categoría</title>
    <style>
        * { box-sizing: border-box; }
        body { max-width: 680px; margin: 40px auto; padding: 0 20px; font-family: Arial, sans-serif; color: #24323d; background: #f3f6f5; }
        h1 { color: #176b58; }
        form { padding: 24px; background: #fff; border: 1px solid #dce5e1; border-radius: 8px; }
        label { display: inline-block; margin-bottom: 7px; font-weight: 600; }
        input, textarea { width: 100%; padding: 10px 12px; border: 1px solid #bdcbc5; border-radius: 5px; font: inherit; }
        textarea { resize: vertical; }
        input:focus, textarea:focus { outline: 2px solid #80c4ad; border-color: #176b58; }
        button, a { transition: background-color .18s ease, color .18s ease, transform .18s ease; }
        button { padding: 10px 16px; border: 0; border-radius: 5px; color: #fff; background: #176b58; font: inherit; font-weight: 600; cursor: pointer; }
        button:hover { background: #105341; transform: translateY(-1px); }
        button:active { transform: translateY(1px); }
        a { color: #176b58; }
        a:hover { color: #0e4939; }
        a:focus-visible, button:focus-visible { outline: 3px solid #80c4ad; outline-offset: 3px; }
        @media (max-width: 480px) { body { margin-top: 24px; } form { padding: 18px; } }
    </style>
</head>
<body>

    <h1>Formulario de categoría</h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <p>
            <label for="nombre">Nombre de la categoría:</label><br>
            <input
                id="nombre"
                type="text"
                name="nombre"
                maxlength="50"
                value="{{ categoria.nombre|default:'' }}"
                required
            >
        </p>

        <p>
            <label for="descripcion">Descripción:</label><br>
            <textarea
                id="descripcion"
                name="descripcion"
                maxlength="200"
                rows="4"
            >{{ categoria.descripcion|default:'' }}</textarea>
        </p>

        <button type="submit">Guardar categoría</button>
    </form>

    <p>
        <a href="{% url 'categorias:listar' %}">
            Volver a categorías
        </a>
    </p>

</body>
</html>
